[package]
name = "silo"
version = "1.0.0"
description = "Silo — Farming Simulator 25 mod library manager"
authors = ["HLLMR Ventures LLC"]
license = "MIT"
repository = "https://github.com/HLLMR/silo"
edition = "2021"
rust-version = "1.77"

# The library holds all logic so it's unit-testable without a running app and
# reusable by a future CLI. main.rs is a thin entry point.
[lib]
name = "silo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# "Open in Silo" — silo:// deep links (a shared collection's web page can hand off to the app).
tauri-plugin-deep-link = "2"
# Desktop-only self-update (GitHub Releases → signed latest.json). Silo targets
# Windows/macOS/Linux only, so no mobile cfg-guard is needed.
tauri-plugin-updater = "2"
# A rotating log file in the app's log folder (release builds have no console), plus the
# `log` facade every module writes through. See `run()` and `fslog.rs`.
tauri-plugin-log = "2"
log = "0.4"
# Copy to the clipboard from Rust: WebKit (macOS, Linux) refuses navigator.clipboard after an
# awaited IPC call. The webview gets no clipboard permission; only commands write to it.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
rayon = "1"
md5 = "0.7"
# Cross-platform "are these the same underlying file?" (file id / inode) — used to prove a
# flat-root entry really is Silo's hardlink projection before removing it. Already in the
# tree via walkdir; taken as a direct dep here.
same-file = "1"
# Provenance manifest hashing (src/provenance.rs) — sha256 of entry/manifest bytes, NFC
# path normalization. Byte-exact parity with SiloAPI is contract-critical, so these back
# the ratified canonicalization (docs: PROVENANCE-CANONICALIZATION.md §7 test vectors).
sha2 = "0.10"
unicode-normalization = "0.1"
dirs = "5"
# Icon decoding: FS25 mod icons are usually .dds (BC1/BC3/BC7); some are .png/.jpg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
image_dds = "0.7"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
# URL parsing for the outbound-request SSRF guard (already in the tree via ureq).
url = "2"
# OS credential store for tokens (Windows Credential Manager / macOS Keychain / Linux
# Secret Service via pure-Rust zbus — no extra system libs). Falls back to SQLite only
# where no keychain exists; see src/secrets.rs.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Process listing, to refuse moving mods while FS25 is running (see gamelaunch::fs25_running).
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }

# single-instance is desktop-only; the `deep-link` feature forwards a silo:// URL to the
# already-running instance instead of spawning a second one (Windows/Linux behaviour).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# NTFS junctions project folder mods without Developer Mode (symlink_dir needs it), so a
# folder mod is linked, not copied (see organize::link_dir_native).
[target.'cfg(windows)'.dependencies]
# 1.4.1+: `create` strips the `\\?\` prefix `canonicalize` adds (organize::junction_to relies on it).
junction = "1.4.1"

[profile.dev]
# Faster incremental dev builds; the heavy work is I/O-bound anyway.
incremental = true
