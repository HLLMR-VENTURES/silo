<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#395a25"/>
      <stop offset="1" stop-color="#1a2c15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.02" r="0.7">
      <stop offset="0" stop-color="#e3b23c" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#e3b23c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c8a3a"/>
      <stop offset="1" stop-color="#395a25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- converging field furrows to a golden-hour horizon, echoing the site -->
  <g stroke="#8a6a45" stroke-opacity="0.20" stroke-width="1.5">
    <line x1="-100" y1="700" x2="960" y2="70"/>
    <line x1="120"  y1="700" x2="960" y2="70"/>
    <line x1="340"  y1="700" x2="960" y2="70"/>
    <line x1="560"  y1="700" x2="960" y2="70"/>
    <line x1="780"  y1="700" x2="960" y2="70"/>
    <line x1="1000" y1="700" x2="960" y2="70"/>
    <line x1="1220" y1="700" x2="960" y2="70"/>
  </g>

  <!-- logo tile + wordmark -->
  <g transform="translate(90,96)">
    <rect width="86" height="86" rx="22" fill="url(#tile)"/>
    <text x="43" y="60" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="52" fill="#ffffff">S</text>
    <text x="112" y="60" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="46" fill="#f3f1e6">Silo</text>
  </g>

  <!-- headline -->
  <text x="90" y="298" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="66" fill="#ffffff">More <tspan fill="#f2d26b" font-style="italic">farming.</tspan></text>
  <text x="90" y="378" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" font-size="66" fill="#ffffff">Less fixing.</text>

  <!-- subhead -->
  <text x="92" y="444" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#d7e0c8">Silo points to the likely culprit when you crash,</text>
  <text x="92" y="480" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#d7e0c8">and flags conflicts before launch.</text>

  <!-- footer strip -->
  <text x="92" y="556" font-family="'DejaVu Sans Mono', monospace" font-size="24" fill="#9cc06e">silo.hllmr.com</text>
  <text x="360" y="556" font-family="'DejaVu Sans', sans-serif" font-size="24" fill="#a8b89a">Free and open source · Windows · macOS and Linux preview</text>
</svg>
