name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# tauri-action builds native installers per-OS and attaches them to a DRAFT (non-prerelease)
# release, so you review before publishing. All bundles are signed for the in-app updater
# (minisign). Windows installers are additionally Authenticode-signed via Azure Trusted
# Signing (no SmartScreen "unknown publisher"); macOS/Linux remain OS-unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # tauri-action creates the draft release and uploads the installers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          - platform: windows-latest
            # Merge the Windows Authenticode sign command (Azure Trusted Signing) only in
            # CI, so local `tauri build` never tries to sign.
            args: --config src-tauri/tauri.conf.signing.json
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Tauri v2's official Linux deps (ayatana only — the old libappindicator3-dev
      # conflicts with it on newer Ubuntu).
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # tauri-action runs the frontend build via tauri.conf's beforeBuildCommand
      # (`npm run build`), but the deps must be installed first.
      - run: npm ci

      # Windows Authenticode signing via Azure Trusted Signing. tauri-action invokes the
      # generated bundle sign command DURING the build (so the updater's minisign signature
      # is computed over the already-signed binary — order matters). macOS/Linux are unsigned.
      - name: Set up Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          # Pass endpoint/account/certificate as explicit flags (env-var names differ across
          # CLI versions); %1 is the file Tauri substitutes. Auth (tenant/client/secret) is
          # read from env by the CLI. Written at build time so no secrets live in the tree.
          $cmd = "trusted-signing-cli -e $env:TS_ENDPOINT -a $env:TS_ACCOUNT -c $env:TS_PROFILE %1"
          $cfg = @{ '$schema' = 'https://schema.tauri.app/config/2'; bundle = @{ windows = @{ signCommand = $cmd } } }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 src-tauri/tauri.conf.signing.json

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — signs the bundles and emits latest.json so the in-app
          # updater can verify and install. Keys live in repo secrets (never in the tree).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure auth for trusted-signing-cli (endpoint/account/profile are flags, above).
          # Windows job only uses these.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Silo ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your OS below. What's new is in the
            [changelog](https://github.com/HLLMR/silo/blob/main/CHANGELOG.md).

            Windows installers are code-signed. macOS/Linux builds are open source and
            OS-unsigned — Gatekeeper may warn on first launch; you can inspect or build
            from source at any time. To check a download, see
            [Verify your download](https://github.com/HLLMR/silo/blob/main/docs/VERIFY_DOWNLOAD.md).
          releaseDraft: true
          # Stable "Latest" channel: publish as a full (non-prerelease) release so the
          # in-app updater's /releases/latest/ endpoint resolves to it. Still created as a
          # draft for review; publishing it makes it Latest.
          prerelease: false
          args: ${{ matrix.args }}

      # Prove the signing actually happened — a signCommand that exits 0 without signing
      # would otherwise ship an unsigned installer. Fail the release if any Windows bundle
      # isn't Valid + timestamped, so a misconfig surfaces as a red job, never a silent gap.
      - name: Verify Windows signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Include *.exe,*.msi
          if (-not $bundles) { throw "No Windows installers found to verify." }
          $bad = 0
          foreach ($f in $bundles) {
            $sig = Get-AuthenticodeSignature $f.FullName
            $subject = $sig.SignerCertificate.Subject
            "$($f.Name): $($sig.Status) | $subject"
            if ($sig.Status -ne 'Valid') { Write-Error "NOT validly signed: $($f.Name) [$($sig.Status)]"; $bad++ }
            elseif (-not $sig.TimeStamperCertificate) { Write-Error "Not timestamped: $($f.Name)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad Windows bundle(s) failed signature verification." }
          "All Windows installers validly signed and timestamped."

  # Attach a SHA256SUMS.txt so users can verify their download. Runs after all platforms have
  # uploaded to the (draft) release AND the SBOM is attached (so it's hashed and attested too;
  # running beside `sbom` raced it and v0.11.0's checksums missed the SBOM), hashes every
  # asset, and adds the checksums file.
  checksums:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # mint the OIDC token for build-provenance attestation
      attestations: write
    steps:
      - name: Generate and attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$TAG"
          repo="$REPO"
          # The build matrix uploads to a DRAFT release; drafts aren't returned by
          # /releases/tags/:tag, so find it by scanning the releases list for this tag.
          rel=$(gh api "repos/$repo/releases" --paginate \
                --jq "map(select(.tag_name==\"$tag\")) | .[0].id")
          [ -n "$rel" ] && [ "$rel" != "null" ] || { echo "no release found for $tag"; exit 1; }
          mkdir -p dist && cd dist
          # Download each asset (except any prior checksums file) to hash it. NOTE: listing
          # is /releases/:rel/assets, but a single asset GET is /releases/assets/:id — NOT
          # nested under the release id. The nested form 404s (this job never worked before).
          gh api "repos/$repo/releases/$rel/assets" --paginate \
            --jq '.[] | select(.name != "SHA256SUMS.txt") | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r id name; do
              gh api "repos/$repo/releases/assets/$id" \
                -H "Accept: application/octet-stream" > "$name"
            done
          sha256sum * | sort -k2 > SHA256SUMS.txt
          echo "---- SHA256SUMS.txt ----"; cat SHA256SUMS.txt
          # Replace any prior checksums asset, then upload straight to the release id (works
          # on a draft, which `gh release upload <tag>` can't reliably resolve).
          old=$(gh api "repos/$repo/releases/$rel/assets" \
                --jq '.[] | select(.name=="SHA256SUMS.txt") | .id' | head -1)
          [ -n "$old" ] && gh api -X DELETE "repos/$repo/releases/assets/$old" || true
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS.txt \
            "https://uploads.github.com/repos/$repo/releases/$rel/assets?name=SHA256SUMS.txt"

      # Cryptographically tie every release artifact to this repo + commit + workflow.
      # `gh attestation verify <file> --repo HLLMR/silo` then proves build provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

  # Attach a Software Bill of Materials (every Rust crate + npm package + license) so the
  # exact contents of a build are inspectable/auditable. Syft scans the lockfiles.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: silo-sbom.cdx.json
          upload-artifact: false
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$TAG"
          repo="$REPO"
          # Drafts aren't returned by /releases/tags/:tag — scan the list for this tag's id.
          rel=$(gh api "repos/$repo/releases" --paginate \
                --jq "map(select(.tag_name==\"$tag\")) | .[0].id")
          [ -n "$rel" ] && [ "$rel" != "null" ] || { echo "no release found for $tag"; exit 1; }
          old=$(gh api "repos/$repo/releases/$rel/assets" \
                --jq '.[] | select(.name=="silo-sbom.cdx.json") | .id' | head -1)
          [ -n "$old" ] && gh api -X DELETE "repos/$repo/releases/assets/$old" || true
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @silo-sbom.cdx.json \
            "https://uploads.github.com/repos/$repo/releases/$rel/assets?name=silo-sbom.cdx.json"
