name: Signing smoke test

# Manual diagnostic for the Azure Trusted Signing setup — isolates signing from the full
# release build so its real output is visible (Tauri swallows the tool's stderr). Signs a
# throwaway .exe, never touches a release. Run from the Actions tab (Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - name: Install Trusted Signing CLI
        run: cargo install trusted-signing-cli --version 0.11.0 --locked

      - name: CLI version + usage (confirm exact flags/env names)
        run: |
          trusted-signing-cli --version
          trusted-signing-cli --help

      - name: Is signtool available?
        shell: pwsh
        run: |
          $st = Get-Command signtool -ErrorAction SilentlyContinue
          if ($st) { "signtool on PATH: $($st.Source)" }
          else {
            "signtool NOT on PATH — searching Windows Kits…"
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName
          }

      - name: Build a throwaway test.exe
        shell: pwsh
        run: |
          'fn main() {}' | Out-File -Encoding ascii test.rs
          rustc test.rs -o test.exe
          if (-not (Test-Path test.exe)) { throw "failed to build test.exe" }
          "built test.exe"

      - name: Sign it (explicit flags + env auth) — show the real error
        continue-on-error: true
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          "endpoint set: $([bool]$env:AZURE_ENDPOINT) | account set: $([bool]$env:AZURE_CODE_SIGNING_NAME) | profile set: $([bool]$env:AZURE_CERT_PROFILE_NAME)"
          "tenant set: $([bool]$env:AZURE_TENANT_ID) | client set: $([bool]$env:AZURE_CLIENT_ID) | secret set: $([bool]$env:AZURE_CLIENT_SECRET)"
          trusted-signing-cli -e $env:AZURE_ENDPOINT -a $env:AZURE_CODE_SIGNING_NAME -c $env:AZURE_CERT_PROFILE_NAME test.exe
          "exit code: $LASTEXITCODE"

      - name: Did it get signed?
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature test.exe
          "Status: $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          "Timestamped: $([bool]$sig.TimeStamperCertificate)"
