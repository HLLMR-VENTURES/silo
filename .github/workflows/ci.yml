name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs svelte-check AND vite build — catches type errors and a
      # broken production bundle in one step.
      - run: npm run build

  rust:
    name: Rust (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Tauri v2 links webkit2gtk-4.1 at build time, so the deps are needed even to
      # compile the crate for `cargo test`.
      # Tauri v2's official Linux deps. On Ubuntu 24.04 (noble) the old
      # libappindicator3-dev CONFLICTS with libayatana-appindicator3-dev — use ayatana
      # only, or apt aborts with held broken packages.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test

  rust-macos:
    name: Rust (macOS clippy + test)
    # The `cfg(target_os = "macos")` code (.app detection, `open -a` launch) never compiles
    # on the ubuntu job — without this it would first be built at release-tag time.
    # No system deps needed: Tauri uses the OS WebKit on macOS. fmt is OS-independent, so
    # it stays on the ubuntu job only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test

  rust-windows:
    name: Rust (Windows clippy + test)
    # Windows is the primary platform: hardlinks, junctions, `\\?\` paths, case folding and
    # file locking all behave differently there, and the `cfg(windows)` tests only run here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    # Hard gate on VULNERABILITIES: `cargo audit` exits non-zero only for actual security
    # advisories, so this fails the build if a vulnerable dependency lands. The remaining
    # ~18 warnings are `unmaintained`/`unsound` advisories on TRANSITIVE crates with no
    # upstream fix (the gtk-rs GTK3 bindings Tauri v2 pulls in on Linux, `proc-macro-error`,
    # the `unic-*` set, and the `glib`/`event-listener` unsoundness) — `cargo audit` reports
    # them in the log for visibility but they do not affect the exit code, so they don't
    # block. Reviewed 2026-07; revisit when Tauri moves off GTK3.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit
