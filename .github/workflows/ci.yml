name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs svelte-check AND vite build — catches type errors and a
      # broken production bundle in one step.
      - run: npm run build

  rust:
    name: Rust (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Tauri v2 links webkit2gtk-4.1 at build time, so the deps are needed even to
      # compile the crate for `cargo test`.
      # Tauri v2's official Linux deps. On Ubuntu 24.04 (noble) the old
      # libappindicator3-dev CONFLICTS with libayatana-appindicator3-dev — use ayatana
      # only, or apt aborts with held broken packages.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
      # `--locked` on every cargo build here: build from the committed Cargo.lock, the one
      # `cargo audit` checks, so a Cargo.toml change without its refreshed lock fails CI (#359).
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  rust-macos:
    name: Rust (macOS clippy + test)
    # The `cfg(target_os = "macos")` code (.app detection, `open -a` launch) never compiles
    # on the ubuntu job — without this it would first be built at release-tag time.
    # No system deps needed: Tauri uses the OS WebKit on macOS. fmt is OS-independent, so
    # it stays on the ubuntu job only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  rust-windows:
    name: Rust (Windows clippy + test)
    # Windows is the primary platform: hardlinks, junctions, `\\?\` paths, case folding and
    # file locking all behave differently there, and the `cfg(windows)` tests only run here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    # Hard gate on VULNERABILITIES: `cargo audit` exits non-zero only for actual security
    # advisories, so this fails the build if a vulnerable dependency lands. The remaining
    # ~18 warnings are `unmaintained`/`unsound` advisories on TRANSITIVE crates with no
    # upstream fix (the gtk-rs GTK3 bindings Tauri v2 pulls in on Linux, `proc-macro-error`,
    # the `unic-*` set, and the `glib`/`event-listener` unsoundness) — `cargo audit` reports
    # them in the log for visibility but they do not affect the exit code, so they don't
    # block. Reviewed 2026-07; revisit when Tauri moves off GTK3.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit

  secrets:
    name: Secret scan (gitleaks)
    # Blocking: scans every commit in history, so a secret committed anywhere fails CI.
    # Findings are redacted in the log (rule, file, line, commit only). Reviewed false
    # positives go in .gitleaksignore with an owner note. Same pinned, checksum-verified
    # gitleaks build as hllmr-infra's CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
